name: Publish Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify extension
        run: npm run verify

      - name: Check publish secrets
        id: secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ] && [ -n "$OVSX_PAT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish because secrets are missing
        if: steps.secrets.outputs.ready != 'true'
        run: echo "Skipping extension publish because VSCE_PAT or OVSX_PAT is not configured."

      - name: Configure Git
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        if: steps.secrets.outputs.ready == 'true'
        run: npm version patch --no-git-tag-version

      - name: Read version
        id: version
        if: steps.secrets.outputs.ready == 'true'
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build VSIX package
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p dist
          npx vsce package --out "dist/vscode-kokoros-tts-${{ steps.version.outputs.value }}.vsix"

      - name: Publish to Visual Studio Marketplace
        if: steps.secrets.outputs.ready == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "dist/vscode-kokoros-tts-${{ steps.version.outputs.value }}.vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: steps.secrets.outputs.ready == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "dist/vscode-kokoros-tts-${{ steps.version.outputs.value }}.vsix" -p "$OVSX_PAT"

      - name: Commit release version
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.value }} [skip ci]"
          git tag "v${{ steps.version.outputs.value }}"

      - name: Push release commit and tag
        if: steps.secrets.outputs.ready == 'true'
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags
